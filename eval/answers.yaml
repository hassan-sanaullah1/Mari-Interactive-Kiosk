# Answer-level eval cases for the English kiosk, drafted from the tester's
# spreadsheet with eval/make_answer_cases.py and then curated by hand.
#
# Each `require` entry is ONE fact the reply must carry, as a list of accepted
# surface forms (OR inside an entry, AND across entries). All present is Matched,
# some is Partial, none is Not Matched — the tester's own three values, so a run
# compares with their column directly. `optional` is counted and reported but
# never graded: it holds the rest of a broad question's content, which one spoken
# reply cannot carry. See eval/factcheck.py for the matching rules.
#
# baseline_grade and baseline_reply are the tester's verdict and the reply they
# graded, on refactor/modular-monolith-architecture. They are what a new run is
# compared against, and what `--score-only` calibrates the scorer on.
# 32 cases.
cases:
  - id: MARI-RAG-004
    lang: en
    depth: "Subsection"
    section: "1.6"
    question: "What is Mari Energies' corporate vision and mission?"
    expected_answer: "Vision: to become a leading integrated energy company shaping the energy landscape while nurturing talent and protecting the planet. Mission: to meet growing energy needs through new resources, talent, technology and ESG standards."
    baseline_grade: Partial
    baseline_reply: "Mari Energies envisions becoming an international integrated exploration and production company that discovers more than it produces, improves profitability through efficient operations, and safeguards the environment while catering to community welfare. Its mission is to meet Pakistan's growing energy needs by finding and developing new resources, deploying top talent, using innovative technologies, and upholding the highest ESG standards."
    baseline_notes: "Missing the nurturing talent part"
    require:
      - ["leading integrated energy"]
      - ["energy landscape"]
      - ["nurturing talent", "nurture talent"]
      - ["protecting the planet", "protect the planet"]
      - ["ESG"]
    optional: ["uplifting communities", "innovative technologies"]
