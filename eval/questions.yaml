# Retrieval evaluation set for the Mari Energies kiosk.
#
# Every entry is a question a visitor could plausibly ask at the kiosk, paired with what
# a *correct* retrieval must return. Two independent signals, because they fail
# differently:
#
#   expect_heading  the heading-path prefix of the section that answers the question
#                   ("4.2" matches "4. Governance ... > 4.2 Board Members"). Catches
#                   topic-level drift.
#   expect_facts    literal substrings that must appear somewhere in the assembled
#                   context. Catches the failure heading-matching misses entirely: the
#                   right section is retrieved but the specific detail (a name, an NTN
#                   number, a well) got cut out by chunking.
#
# expect_heading: null marks a NEGATIVE case — the corpus does not cover it, and a
# correct system returns nothing above the relevance threshold. These are scored
# separately (see eval/run_eval.py); without them a retriever that returns five chunks
# for literally any input scores perfectly on hit@k.
#
# Urdu entries carry the register kiosk visitors actually speak: transliterated English
# nouns inside Urdu grammar ("ریکروٹمنٹ کا کیا پروسیس ہے"). Do not "correct" them into
# formal Urdu — that is not what the STT emits.
#
# Sources: tests/retrieval_cases.py (section coverage) and tests/test_retrieval_facts.py
# (fact coverage), extended with the English half of the kiosk and negative cases.

