  # ── additional negative cases ──────────────────────────────────────
  # Calibrating a "return nothing" threshold against three examples is not calibration.
  # These are the shapes of off-corpus question a public kiosk actually receives: other
  # companies, live market data the corpus cannot hold, adjacent-but-absent topics
  # (Mari's *competitors*, its share price *today*), and plain chit-chat. Several are
  # deliberately near-miss — they use in-domain vocabulary about out-of-domain facts,
  # which is the case a naive similarity threshold gets wrong.
  - id: neg-138
