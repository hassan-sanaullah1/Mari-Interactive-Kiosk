# Local runs only: Compose merges this file into docker-compose.yml automatically.
# Coolify reads docker-compose.yml alone, so nothing here reaches a server.
services:
  backend:
    ports:
      - "8010:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MARI_ADMIN_TOKEN: ${MARI_ADMIN_TOKEN:-}
    volumes:
      # LAN admin uploads to /admin land here; also a bind mount so uploads survive
      # future container rebuilds (the baked-in server/data would otherwise shadow them).
      - ./server/data:/app/server/data
      # Keep /app/server/admin.py and the patched /app/server/app.py visible to the
      # container without a rebuild. Narrow mounts only, so the rest of /app/server
      # stays as it was baked into the image.
      - ./server/admin.py:/app/server/admin.py:ro
      # The admin panel's credential store, imported by admin.py.
      - ./server/admin_credentials.py:/app/server/admin_credentials.py:ro
      - ./server/app.py:/app/server/app.py:ro
      # admin.py reads its upload cap from config.ADMIN_MAX_UPLOAD_MB, so the
      # two files have to be the same vintage: mounting admin.py alone left the
      # container with the image's older config and the backend would not start.
      - ./server/config.py:/app/server/config.py:ro
  frontend:
    ports:
      - "3000:3000"
