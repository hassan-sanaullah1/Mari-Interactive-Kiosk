name: CI

# What has to hold for a change to land. Before this existed nothing ran on a PR:
# no tests, no lint, no type check, no build — the first sign of a break was the
# deployed kiosk.
#
# Everything here runs without secrets and without the GPU, Qdrant or the live LLM.
# The checks that need those (eval/run_eval.py, eval/run_answers.py, the lipsync
# audit) are run by hand against eval/baselines/ and are listed in that directory's
# README.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes the previous run on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — lint, types, imports, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff (style, naming, complexity)
        run: ruff check .

      - name: import-linter (the layer rule in pyproject.toml)
        run: lint-imports

      - name: mypy
        run: mypy

      # The suite includes the golden snapshot, the /ws and lipsync snapshots and the
      # turn-timing guard, so a behaviour change fails here rather than in production.
      - name: pytest
        run: pytest -q

      - name: pip-audit
        run: pip-audit --requirement requirements.txt --strict
        # Advisory: a new CVE in a pinned dependency should be visible without
        # blocking an unrelated change. The daily security-audit workflow is the
        # one that chases these.
        continue-on-error: true

  frontend:
    name: frontend — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: eslint (layering + presenters-are-data)
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      # Every per-presenter look value, compared against the recorded snapshot: this
      # is what proves a refactor of the avatar config changed no pixel.
      - name: avatar profile snapshot
        run: npm run profiles:check

      - name: next build
        run: npm run build

  containers:
    name: containers — compose config and image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        # The deploy fails on a malformed compose file long after merge otherwise.
        run: docker compose config --quiet
        env:
          MARI_RAG_QDRANT_API_KEY: ci-placeholder

      - name: build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
