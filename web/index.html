<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>MARI · Voice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='40%25'%3E%3Cstop offset='0' stop-color='%2300d4ff'/%3E%3Cstop offset='1' stop-color='%236d5cff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='42' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">MARI</span>
        <span class="brand-sub">speech · to · speech</span>
      </div>
      <div class="lang-toggle" id="langToggle" role="group" aria-label="Language">
        <button class="lang-btn is-active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ur">اردو</button>
      </div>
    </header>

    <main class="stage">
      <!-- The reactive voice orb -->
      <div class="orb-wrap" id="orbWrap">
        <canvas id="orb" class="orb-canvas"></canvas>
        <div class="orb-glow" aria-hidden="true"></div>
      </div>

      <div class="status" id="status">
        <span class="status-label" id="statusLabel">Tap to speak</span>
        <span class="status-caption" id="statusCaption">Ask MARI anything</span>
      </div>

      <!-- Live transcript / captions -->
      <div class="transcript" id="transcript" aria-live="polite"></div>
    </main>

    <footer class="controls">
      <button class="mic-btn" id="micBtn" aria-label="Tap to speak">
        <span class="mic-ring" aria-hidden="true"></span>
        <svg class="mic-icon" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 0 0-7 0v5A3.5 3.5 0 0 0 12 15Z" />
          <path d="M18.5 11.5a6.5 6.5 0 0 1-13 0M12 18v3.5M8.5 21.5h7" fill="none" stroke-width="1.8" />
        </svg>
        <svg class="stop-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" rx="2.5" />
        </svg>
      </button>
      <p class="hint" id="hint">Hold a quiet moment, then tap — MARI listens, thinks, and replies.</p>
    </footer>
  </div>

  <div class="toast" id="toast" role="alert"></div>

  <script src="/app.js"></script>
</body>
</html>
