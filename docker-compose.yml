# intelligent-kiosk — the stack Coolify deploys: Qdrant, backend, frontend.
#
# Local runs also merge docker-compose.override.yml (published ports) automatically;
# `make dev` adds docker-compose.a2f.yml when the Audio2Face stack is running.
# The reasons behind every setting below are in docs/deployment.md.

services:
  # Vector store for retrieval. In this stack because the backend cannot answer grounded
  # questions without it.
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    environment:
      # Required: Qdrant has no auth by default and its API can delete collections.
      QDRANT__SERVICE__API_KEY: ${MARI_RAG_QDRANT_API_KEY:?set MARI_RAG_QDRANT_API_KEY}
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
    volumes:
      - qdrant_storage:/qdrant/storage
    # No ports: the backend reaches it by service name; 6333 is an admin API.
    healthcheck:
      # bash /dev/tcp because the image has no curl; /readyz waits for collections to load.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Provider keys: a local .env, or the one Coolify writes from its variables.
    env_file:
      - path: .env
        required: false
    environment:
      # These win over .env, so a .env written for running on the host works in here.
      MARI_HOST: 0.0.0.0
      MARI_PORT: 8010
      APP_COMMIT: ${APP_COMMIT:-local}
      MARI_RAG_QDRANT_HOST: qdrant
      MARI_RAG_QDRANT_PORT: "6333"
      MARI_RAG_QDRANT_API_KEY: ${MARI_RAG_QDRANT_API_KEY:?set MARI_RAG_QDRANT_API_KEY}
      # Plaintext network; qdrant-client would otherwise switch to HTTPS once a key is set.
      MARI_RAG_QDRANT_HTTPS: "false"
      # Ingestion bookkeeping lives with the Qdrant data it describes, not in the image.
      MARI_RAG_METADATA_DB: /app/state/rag_metadata.sqlite
      # Must match the fastembed_cache mount, or 3 GB of weights re-download per recreate.
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - whisper_cache:/root/.cache/huggingface
      - fastembed_cache:/root/.cache/fastembed
      - rag_state:/app/state
    # Healthcheck: server/Dockerfile, against /health/ready.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Both are baked in at build time by Next.js; a runtime variable has no effect.
        MARI_API_ORIGIN: http://backend:8010
        # The backend's public wss://…/ws URL; empty locally (derived from the page host).
        NEXT_PUBLIC_MARI_WS: ${NEXT_PUBLIC_MARI_WS:-}
    restart: unless-stopped
    environment:
      APP_COMMIT: ${APP_COMMIT:-local}
    # Containment after the 2026-09 Next.js RCE compromise: read-only, no capabilities,
    # no privilege regain, and resource caps.
    read_only: true
    tmpfs:
      # uid/gid 1000 = the image's `node` user; .next/cache is the only path Next writes.
      - /tmp:size=64m,noexec,nosuid,nodev,uid=1000,gid=1000
      - /app/.next/cache:size=128m,noexec,nosuid,nodev,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      # service_started, not service_healthy: a slow backend boot must not take the
      # whole site down; the UI already handles /api/* failing until it answers.
      backend:
        condition: service_started
    # Healthcheck: frontend/Dockerfile, against /version.json.

volumes:
  whisper_cache:
  qdrant_storage:
  # Records what is inside qdrant_storage; create and remove the two together.
  rag_state:
  fastembed_cache:
